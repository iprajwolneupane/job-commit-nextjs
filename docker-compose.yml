services:
  cron:
    build: .
    command: pnpm run cron:scrape
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/next_app_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - postgres
  worker:
    build: .
    command: pnpm run worker:scrape
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/next_app_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - postgres
  postgres:
    image: pgvector/pgvector:pg16
    container_name: next_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: next_app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: next_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      -   redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
